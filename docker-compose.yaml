services:
  backend:
    platform: linux/amd64
    image: jhjhkkk/hobbyloop-backend:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      SERVER_ADDRESS: 0.0.0.0
    expose:
      - "8080"
    volumes:
      - uploads-data:/var/lib/hobbyloop/uploads
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-network

  frontend:
    platform: linux/amd64
    image: jhjhkkk/hobbyloop-frontend:1.0.0
    build:
      context: ../community-ktb
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - app-network

volumes:
  uploads-data:

networks:
  app-network:
    driver: bridge
