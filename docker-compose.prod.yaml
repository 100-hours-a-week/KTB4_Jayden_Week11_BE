services:
  backend:
    image: jhjhkkk/hobbyloop-backend:1.0.0
    container_name: hobbyloop-backend

    env_file:
      - .env.prod
    environment:
      SERVER_ADDRESS: 0.0.0.0
    expose:
      - "8080"
    volumes:
      - uploads-data:/var/lib/hobbyloop/uploads

    networks:
      - app-network

  frontend:
    image: jhjhkkk/hobbyloop-frontend:1.0.0
    container_name: hobbyloop-frontend

    depends_on:
      backend:
        condition: service_started
    ports:
      - "${HTTP_PORT:-80}:80"

    restart: unless-stopped

    networks:
      - app-network

volumes:
  uploads-data:

networks:
  app-network:
    driver: bridge
